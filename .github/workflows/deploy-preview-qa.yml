name: Deploy Preview QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: deploy-preview-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--tiny-paletas-35daca.netlify.app
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium

      - name: Wait for this commit's Netlify preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..90}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/status" \
              --jq '.statuses[] | select(.context | endswith("/deploy-preview")) | .state' \
              | head -1)"
            if [ "$state" = "success" ]; then
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              exit 1
            fi
            sleep 10
          done
          exit 1

      - name: Verify the deployed preview
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ env.PREVIEW_URL }}

      - name: Store browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-preview-qa-${{ github.event.pull_request.number }}
          path: |
            playwright-report/
            test-results/
            qa/screenshots/privacy-readiness/current/
          retention-days: 7
          if-no-files-found: warn
